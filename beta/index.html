<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página No Disponible</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .icon {
            font-size: 64px;
            color: #e74c3c;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        p {
            font-size: 16px;
            color: #7f8c8d;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            background-color: #3498db;
            color: #fff;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Icono decorativo (puedes cambiarlo por una imagen si lo prefieres) -->
        <div class="icon">⚠️</div>
        
        <h1>Página No Disponible</h1>
        
        <p>Lo sentimos, en este momento la sección a la que intentas acceder no se encuentra operativa. Estamos trabajando para solucionarlo lo antes posible.</p>
        
        <!-- Botón de acción para redirigir al usuario -->
        <a href="/" class="btn">Volver al Inicio</a>
    </div>

</body>
</html>
